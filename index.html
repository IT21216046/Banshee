<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover your game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="backgame">
    <nav>
        <img src="images/BANSHEE__1.png" class="logo">
        <ul>
            <li><a href="#">Category</a></li>
            <li><a href="#">News</a></li>
            <li><a href="#">About Us</a></li>
        </ul>
        <div>
            <a href="#" class="login-btn">Log In</a>
            <a href="#" class="signup-btn">Sign Up</a>
        </div>
    </nav>
    <div class="content">
        <h1 class="anim">Discover<br>Your Game</h1>
        <p class="anim">Join the ultimate gaming hub. Discover new games, meet fellow gamers, and explore the world of gaming like never before</p>
        <a href="#" class="signup-btn anim">Join Now</a>

    </div>
    <div class="carousel anim">
        <button class="prev">&#10094;</button>

        <div class="carousel-track-container">
            <ul class="carousel-track">
            <li class="carousel-slide current-slide">
                <img src="images/RDR2.jpg" alt="Image 1">
            </li>
            <li class="carousel-slide">
                <img src="images/DARKSOULS3.jpg" alt="Image 2">
            </li>
            <li class="carousel-slide">
                <img src="images/SEKIRO.jpg" alt="Image 3">
            </li>
            </ul>
        </div>

        <button class="next">&#10095;</button>
    </div>
    
    </div>
</body>
<script>
  const track = document.querySelector('.carousel-track');
  const slides = Array.from(track.children);
  const nextButton = document.querySelector('.next');
  const prevButton = document.querySelector('.prev');

  let currentSlideIndex = 0;
  let autoScrollInterval;
  let autoScrollDelay = 3000; // in milliseconds

  function updateCarousel(position) {
    const slideWidth = slides[0].getBoundingClientRect().width;
    track.style.transform = 'translateX(-' + slideWidth * position + 'px)';
    slides.forEach(slide => slide.classList.remove('current-slide'));
    slides[position].classList.add('current-slide');
  }

  function nextSlide() {
    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
    updateCarousel(currentSlideIndex);
  }

  function prevSlide() {
    currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
    updateCarousel(currentSlideIndex);
  }

  // Auto-scroll setup
  function startAutoScroll() {
    autoScrollInterval = setInterval(nextSlide, autoScrollDelay);
  }

  function stopAutoScroll() {
    clearInterval(autoScrollInterval);
  }

  // When buttons are clicked, move manually and restart auto-scroll
  nextButton.addEventListener('click', () => {
    stopAutoScroll();
    nextSlide();
    startAutoScroll();
  });

  prevButton.addEventListener('click', () => {
    stopAutoScroll();
    prevSlide();
    startAutoScroll();
  });

  // Init
  updateCarousel(0);
  startAutoScroll();
</script>


</html>
